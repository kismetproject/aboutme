<!doctype html>
<html lang="en-GB">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="impalametallica"
  >

  <title>impalametallica</title>


  <!-- FONTS -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap"
    rel="stylesheet"
  >


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    :root {

      --background:
        #37312e;

      --panel:
        rgba(20, 21, 20, 0.95);

      --dark:
        #101110;

      --line:
        rgba(220, 222, 216, 0.16);

      --line-strong:
        rgba(220, 222, 216, 0.26);

      --text:
        #deddd6;

      --muted:
        #9a9c96;

      --dim:
        #6f726d;

      --max-width:
        1160px;

    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        var(--background);

      color:
        var(--text);

      font-family:
        "Courier Prime",
        "Courier New",
        monospace;

      line-height:
        1.5;

    }


    a {
      color: inherit;
      text-decoration: none;
    }


    button,
    input {
      font: inherit;
    }


    img {
      display: block;
      max-width: 100%;
    }



    /* =================================
       SITE SHELL
       ================================= */

    .site-shell {

      width:
        min(
          calc(100% - 42px),
          var(--max-width)
        );

      margin:
        34px auto;

      background:
        var(--panel);

      border:
        1px solid
        rgba(222,224,217,.24);

      box-shadow:
        0 22px 60px
        rgba(0,0,0,.34);

      position:
        relative;

      isolation:
        isolate;

    }


    .site-shell::before {

      content: "";

      position:
        absolute;

      inset:
        0;

      z-index:
        -1;

      pointer-events:
        none;

      opacity:
        .15;

      background-image:

        linear-gradient(
          90deg,
          transparent 0 49.8%,
          rgba(255,255,255,.018) 50%,
          transparent 50.2%
        ),

        linear-gradient(
          transparent 0 49.8%,
          rgba(255,255,255,.014) 50%,
          transparent 50.2%
        );

      background-size:
        5px 5px;

    }



    /* =================================
       HEADER
       ================================= */

    .site-header {

      min-height:
        78px;

      padding:
        18px 30px;

      border-bottom:
        1px solid
        var(--line);

      display:
        grid;

      grid-template-columns:
        1fr auto;

      gap:
        32px;

      align-items:
        center;

    }


    .brand-title {

      margin:
        0;

      font-family:
        "Special Elite",
        "Courier Prime",
        monospace;

      font-size:
        clamp(
          1.35rem,
          2.1vw,
          2rem
        );

      font-weight:
        400;

      letter-spacing:
        .03em;

      color:
        #eceae4;

    }


    .brand-subtitle {

      display:
        block;

      margin-top:
        2px;

      color:
        #aaa9a2;

      font-size:
        .72rem;

      letter-spacing:
        .24em;

      text-transform:
        lowercase;

    }



    /* =================================
       NAVIGATION
       ================================= */

    .main-nav {

      display:
        flex;

      align-items:
        center;

      color:
        #c7c5be;

      font-size:
        .78rem;

      text-transform:
        uppercase;

      letter-spacing:
        .08em;

      white-space:
        nowrap;

    }


    .main-nav a {

      padding:
        7px 12px;

    }


    .main-nav a + a::before {

      content:
        "|";

      color:
        #777a76;

      margin-right:
        24px;

      margin-left:
        -12px;

    }


    .main-nav a:hover,
    .main-nav a:focus-visible,
    .main-nav a[aria-current="page"] {

      color:
        #f2f0ea;

      background:
        rgba(195,199,192,.08);

      outline:
        none;

    }



    /* =================================
       WRITING PAGE
       ================================= */

    .writing-page {

      padding:
        31px 30px 42px;

    }


    .writing-intro {

      padding-bottom:
        23px;

      border-bottom:
        1px solid
        var(--line);

    }


    .writing-intro h2 {

      margin:
        0;

      font-family:
        "Special Elite",
        "Courier Prime",
        monospace;

      font-size:
        clamp(
          2rem,
          4.5vw,
          3.2rem
        );

      line-height:
        1.1;

      font-weight:
        400;

      color:
        #ebe8e1;

    }


    .writing-intro p {

      max-width:
        680px;

      margin:
        7px 0 0;

      color:
        var(--muted);

      font-size:
        .82rem;

    }



    /* =================================
       CATEGORY FILTERS
       ================================= */

    .category-bar {

      margin-top:
        22px;

      display:
        flex;

      flex-wrap:
        wrap;

      border-bottom:
        1px solid
        var(--line-strong);

    }


    .category-button {

      appearance:
        none;

      border:
        0;

      border-top:
        1px solid
        var(--line);

      border-left:
        1px solid
        var(--line);

      background:
        #111210;

      color:
        #858883;

      padding:
        10px 15px;

      cursor:
        pointer;

      font-size:
        .7rem;

      letter-spacing:
        .07em;

      text-transform:
        uppercase;

    }


    .category-button:last-child {

      border-right:
        1px solid
        var(--line);

    }


    .category-button:hover {

      color:
        #d3d2cc;

      background:
        #181a18;

    }


    .category-button.active {

      color:
        #eeeae4;

      background:
        #252723;

      border-top-color:
        rgba(230,231,224,.4);

    }



    /* =================================
       SEARCH + COUNT
       ================================= */

    .archive-tools {

      margin:
        20px 0 17px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap:
        20px;

    }


    .search-box {

      width:
        min(
          100%,
          390px
        );

    }


    .search-box label {

      display:
        block;

      margin-bottom:
        5px;

      color:
        #7d807a;

      font-size:
        .65rem;

      letter-spacing:
        .12em;

      text-transform:
        uppercase;

    }


    .search-box input {

      width:
        100%;

      padding:
        9px 11px;

      border:
        1px solid
        var(--line);

      background:
        var(--dark);

      color:
        #d9d8d1;

      outline:
        none;

    }


    .search-box input::placeholder {
      color: #5e615d;
    }


    .search-box input:focus {

      border-color:
        rgba(220,222,216,.42);

    }


    .archive-count {

      color:
        #696c67;

      font-size:
        .67rem;

      white-space:
        nowrap;

    }



    /* =================================
       PROJECT GRID
       ================================= */

    .project-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap:
        15px;

    }


    .project-card {

      min-width:
        0;

      display:
        flex;

      flex-direction:
        column;

      background:
        rgba(7,8,7,.18);

      border:
        1px solid
        var(--line);

      overflow:
        hidden;

      transition:
        border-color 150ms ease;

    }


    .project-card:hover {

      border-color:
        rgba(220,222,216,.28);

    }



    /* =================================
       OPTIONAL COVER
       ================================= */

    .project-image-link {

      display:
        block;

      border-bottom:
        1px solid
        var(--line);

      overflow:
        hidden;

    }


    .project-cover {

      width:
        100%;

      aspect-ratio:
        16 / 8;

      object-fit:
        cover;

      filter:
        grayscale(10%)
        saturate(74%)
        brightness(88%);

      transition:
        filter 160ms ease,
        transform 160ms ease;

    }


    .project-card:hover
    .project-cover {

      filter:
        grayscale(0%)
        saturate(85%)
        brightness(94%);

      transform:
        scale(1.01);

    }



    /* =================================
       PROJECT BODY
       ================================= */

    .project-body {

      padding:
        16px 17px 15px;

      display:
        flex;

      flex-direction:
        column;

      flex:
        1;

    }


    .project-meta {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;

      align-items:
        center;

      color:
        #747772;

      font-size:
        .63rem;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

    }


    .meta-divider {
      color: #484b47;
    }


    .project-title {

      margin:
        7px 0 8px;

      font-family:
        "Special Elite",
        "Courier Prime",
        monospace;

      font-size:
        1.35rem;

      line-height:
        1.25;

      font-weight:
        400;

      color:
        #e7e4dd;

    }


    .project-title a:hover {
      color: #fffdf7;
    }


    .project-summary {

      margin:
        0 0 20px;

      color:
        #9b9d97;

      font-size:
        .79rem;

      line-height:
        1.58;

    }


    .project-footer {

      margin-top:
        auto;

      padding-top:
        11px;

      border-top:
        1px dashed
        rgba(220,222,216,.1);

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        12px;

    }


    .project-date {

      color:
        #626560;

      font-size:
        .62rem;

    }


    .open-project {

      color:
        #aeb0aa;

      font-size:
        .69rem;

      white-space:
        nowrap;

    }


    .open-project:hover {
      color: #eceae4;
    }



    /* =================================
       EMPTY / LOADING
       ================================= */

    .archive-message {

      grid-column:
        1 / -1;

      padding:
        42px 3px;

      color:
        #81847f;

      font-size:
        .8rem;

    }



    /* =================================
       FOOTER
       ================================= */

    .site-footer {

      padding:
        11px 24px;

      background:
        #101110;

      border-top:
        1px solid
        rgba(228,228,221,.16);

      display:
        grid;

      grid-template-columns:
        auto auto auto 1fr;

      gap:
        18px;

      align-items:
        center;

      color:
        #787b76;

      font-size:
        .66rem;

    }


    .footer-item {
      white-space: nowrap;
    }


    .footer-quote {

      justify-self:
        end;

      color:
        #8d8f8a;

      font-style:
        italic;

      text-align:
        right;

    }



    /* =================================
       RESPONSIVE
       ================================= */

    @media (max-width: 800px) {

      .site-shell {

        width:
          min(
            calc(100% - 24px),
            760px
          );

        margin:
          18px auto;

      }


      .site-header {

        grid-template-columns:
          1fr;

        gap:
          14px;

      }


      .main-nav {
        flex-wrap: wrap;
      }


      .project-grid {
        grid-template-columns: 1fr;
      }


      .site-footer {
        grid-template-columns:
          1fr 1fr;
      }


      .footer-quote {

        justify-self:
          start;

        text-align:
          left;

      }

    }


    @media (max-width: 560px) {

      .site-shell {

        width:
          100%;

        margin:
          0;

        border-left:
          0;

        border-right:
          0;

      }


      .site-header,
      .writing-page {

        padding-left:
          14px;

        padding-right:
          14px;

      }


      .category-bar {

        display:
          grid;

        grid-template-columns:
          repeat(2, 1fr);

      }


      .category-button {

        border:
          1px solid
          var(--line);

        margin:
          -1px -1px 0 0;

      }


      .archive-tools {

        align-items:
          flex-start;

        flex-direction:
          column;

        gap:
          10px;

      }


      .site-footer {

        grid-template-columns:
          1fr;

        gap:
          8px;

      }

    }

  </style>

</head>


<body>


  <main class="site-shell">


    <!-- HEADER -->

    <header class="site-header">


      <a
        href="index.html"
        aria-label="impalametallica home"
      >

        <h1 class="brand-title">
          impalametallica
        </h1>

        <span class="brand-subtitle">
          a personal writing archive
        </span>

      </a>


      <nav
        class="main-nav"
        aria-label="Main navigation"
      >

        <a href="index.html">
          Home
        </a>

        <a
          href="writing.html"
          aria-current="page"
        >
          Writing
        </a>

        <a href="notebook.html">
          Notebook
        </a>

        <a href="about.html">
          About
        </a>

      </nav>


    </header>



    <!-- WRITING -->

    <section class="writing-page">


      <header class="writing-intro">

        <h2>
          writing...
        </h2>

        <p>
          stories, scripts, fan works, concepts and
          miscellaneous things pulled from various corners
          of my brain.
        </p>

      </header>



      <!-- FILTERS -->

      <div
        class="category-bar"
        aria-label="Writing categories"
      >

        <button
          class="category-button active"
          type="button"
          data-filter="all"
        >
          all
        </button>


        <button
          class="category-button"
          type="button"
          data-filter="stories"
        >
          stories
        </button>


        <button
          class="category-button"
          type="button"
          data-filter="scripts"
        >
          scripts
        </button>


        <button
          class="category-button"
          type="button"
          data-filter="fan works"
        >
          fan works
        </button>


        <button
          class="category-button"
          type="button"
          data-filter="concepts"
        >
          concepts
        </button>


        <button
          class="category-button"
          type="button"
          data-filter="misc"
        >
          misc
        </button>

      </div>



      <!-- SEARCH -->

      <div class="archive-tools">


        <div class="search-box">

          <label for="writing-search">
            search the archive
          </label>

          <input
            id="writing-search"
            type="search"
            placeholder="title, summary, status..."
            autocomplete="off"
          >

        </div>


        <div
          class="archive-count"
          id="archive-count"
        >
          loading...
        </div>


      </div>



      <!-- PROJECTS -->

      <div
        class="project-grid"
        id="project-grid"
      >

        <p class="archive-message">
          opening the archive...
        </p>

      </div>


    </section>



    <!-- FOOTER -->

    <footer class="site-footer">


      <span class="footer-item">

        last updated:

        <span id="last-updated">
          —
        </span>

      </span>


      <span class="footer-item">

        currently reading:

        <span id="currently-reading">
          —
        </span>

      </span>

      <span class="footer-quote">
        "Bitch."     "Jerk."
      </span>


    </footer>


  </main>



  <script>


    /* =================================
       SUPABASE
       ================================= */

    const SUPABASE_URL =
      "https://cadljjvyicpgiwlfyigr.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_PBBvFxgfK9w3U5et1_sM1Q_sUBAtdJp";


    const db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /* =================================
       STATE
       ================================= */

    let allProjects =
      [];


    let currentFilter =
      "all";



    /* =================================
       LOAD PROJECTS
       ================================= */

    async function loadProjects() {


      const grid =
        document.getElementById(
          "project-grid"
        );


      const {
        data,
        error
      } =
        await db
          .from("writing")
          .select(`
            id,
            slug,
            title,
            project_type,
            summary,
            status,
            cover_url,
            updated_at
          `)
          .eq(
            "published",
            true
          )
          .order(
            "updated_at",
            {
              ascending:
                false
            }
          );


      if (error) {


        console.error(
          "Could not load writing:",
          error
        );


        grid.innerHTML = `
          <p class="archive-message">
            couldn't open the archive.
          </p>
        `;


        document
          .getElementById(
            "archive-count"
          )
          .textContent =
          "—";


        return;

      }


      allProjects =
        data || [];


      renderProjects();

    }



    /* =================================
       CATEGORY BUTTONS
       ================================= */

    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(
        button => {


          button.addEventListener(
            "click",
            () => {


              currentFilter =
                button.dataset.filter;


              document
                .querySelectorAll(
                  ".category-button"
                )
                .forEach(
                  other => {


                    other.classList.toggle(
                      "active",
                      other === button
                    );


                  }
                );


              renderProjects();

            }
          );

        }
      );



    /* =================================
       SEARCH
       ================================= */

    document
      .getElementById(
        "writing-search"
      )
      .addEventListener(
        "input",
        renderProjects
      );



    /* =================================
       RENDER PROJECTS
       ================================= */

    function renderProjects() {


      const grid =
        document.getElementById(
          "project-grid"
        );


      const search =
        document
          .getElementById(
            "writing-search"
          )
          .value
          .trim()
          .toLowerCase();


      const visibleProjects =
        allProjects.filter(
          project => {


            const type =
              (
                project.project_type ||
                "misc"
              )
                .trim()
                .toLowerCase();


            const matchesCategory =
              currentFilter === "all"

              ||

              type === currentFilter;


            const searchable =
              [
                project.title,
                project.summary,
                project.status,
                project.project_type
              ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


            const matchesSearch =
              !search

              ||

              searchable.includes(
                search
              );


            return (
              matchesCategory &&
              matchesSearch
            );

          }
        );


      updateCount(
        visibleProjects.length
      );


      if (
        visibleProjects.length === 0
      ) {


        grid.innerHTML = `
          <p class="archive-message">
            nothing found here...
          </p>
        `;


        return;

      }


      grid.innerHTML =
        "";


      visibleProjects.forEach(
        project => {


          const card =
            document.createElement(
              "article"
            );


          card.className =
            "project-card";


          const link =
            `project.html?slug=${encodeURIComponent(project.slug)}`;


          const coverURL =
            (
              project.cover_url ||
              ""
            )
              .trim();


          const coverHTML =
            coverURL

              ? `

                <a
                  class="project-image-link"
                  href="${link}"
                  aria-label="Open ${escapeHTML(project.title)}"
                >

                  <img
                    class="project-cover"
                    src="${escapeHTML(coverURL)}"
                    alt=""
                  >

                </a>

              `

              : "";


          card.innerHTML = `

            ${coverHTML}


            <div class="project-body">


              <div class="project-meta">


                <span>
                  ${escapeHTML(
                    project.project_type ||
                    "misc"
                  )}
                </span>


                <span class="meta-divider">
                  /
                </span>


                <span>
                  ${escapeHTML(
                    project.status ||
                    "in progress"
                  )}
                </span>


              </div>



              <h3 class="project-title">

                <a href="${link}">

                  ${escapeHTML(
                    project.title
                  )}

                </a>

              </h3>



              <p class="project-summary">

                ${escapeHTML(
                  project.summary ||
                  "No summary yet."
                )}

              </p>



              <div class="project-footer">


                <span class="project-date">

                  updated
                  ${formatDate(
                    project.updated_at
                  )}

                </span>


                <a
                  class="open-project"
                  href="${link}"
                >
                  open project →
                </a>


              </div>


            </div>

          `;


          grid.appendChild(
            card
          );

        }
      );

    }



    /* =================================
       PROJECT COUNT
       ================================= */

    function updateCount(
      amount
    ) {


      const label =
        amount === 1
          ? "project"
          : "projects";


      const category =
        currentFilter === "all"
          ? ""
          : ` in ${currentFilter}`;


      document
        .getElementById(
          "archive-count"
        )
        .textContent =
        `${amount} ${label}${category}`;

    }



    /* =================================
       DATE
       ================================= */

    function formatDate(
      value
    ) {


      if (!value) {
        return "—";
      }


      return new Intl.DateTimeFormat(
        "en-GB",
        {

          day:
            "2-digit",

          month:
            "2-digit",

          year:
            "2-digit"

        }
      )
      .format(
        new Date(value)
      )
      .replaceAll(
        "/",
        "."
      );

    }



    /* =================================
       SITE SETTINGS
       ================================= */

    async function loadSiteSettings() {


      const {
        data,
        error
      } =
        await db
          .from(
            "site_settings"
          )
          .select("*")
          .eq(
            "id",
            1
          )
          .single();


      if (
        error ||
        !data
      ) {

        return;

      }


      document
        .getElementById(
          "currently-reading"
        )
        .textContent =
        data.currently_reading ||
        "—";


      if (
        data.last_updated
      ) {


        document
          .getElementById(
            "last-updated"
          )
          .textContent =
          formatDate(
            data.last_updated
          );


      }

    }



    /* =================================
       WEATHER
       ================================= */

    async function loadWeather() {


      const weather =
        document.getElementById(
          "weather"
        );


      try {


        const response =
          await fetch(
            "/api/weather",
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Weather unavailable"
          );

        }


        const data =
          await response.json();


        weather.textContent =
          `${data.icon || "☁"} ${data.label}, ${Math.round(data.temperature)}°C`;


      }


      catch {


        weather.textContent =
          "weather —";

      }

    }



    /* =================================
       ESCAPE HTML
       ================================= */

    function escapeHTML(
      value
    ) {


      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }



    /* =================================
       START
       ================================= */

    loadProjects();

    loadSiteSettings();

    loadWeather();


  </script>
